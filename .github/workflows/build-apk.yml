name: Build APK

# Builds AirMirrorTV.apk on every push to main, on pull requests and on demand.
#
# Releasing an update: change `val appVersion = "..."` in app/build.gradle.kts and push to main.
# If no release exists yet for that version, this publishes "v<version>" with the APK attached.
# Installed apps check GitHub Releases and offer the update in the app.
#
# Also: pushing a tag like v1.17, or Actions -> Build APK -> Run workflow with "release_tag",
# publishes a release for that tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v1.17). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to see whether this version is already released

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the removed 'tools' package.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # gradle.properties points Java at the Windows certificate store (Windows-ROOT), which
      # exists only on Windows. Drop it on this Linux runner so Gradle can download over HTTPS;
      # local Windows builds keep using the file as it is.
      - name: Use the Linux certificate store
        run: |
          sed -i 's/ *-Djavax.net.ssl.trustStoreType=Windows-ROOT//' gradle.properties
          sed -i '/^systemProp.javax.net.ssl.trustStoreType=Windows-ROOT$/d' gradle.properties
          cat gradle.properties

      # The signing key comes from repository secrets (Settings -> Secrets and variables ->
      # Actions), created once with tools/create-signing-key.bat. It is written to the runner's
      # temp folder only for this build. Pull requests from forks don't get secrets and fall
      # back to the debug key.
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AIRMIRROR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AIRMIRROR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No AIRMIRROR_KEYSTORE_BASE64 / AIRMIRROR_KEYSTORE_PASSWORD secrets: signing with a throwaway debug key, so in-app updates won't install over this build. Run tools/create-signing-key.bat once and add the two secrets."
            exit 0
          fi
          # Pasting into the secrets page easily adds a trailing line break or space; drop it.
          PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          echo "::add-mask::$PASSWORD"
          KEYSTORE="$RUNNER_TEMP/airmirror.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$KEYSTORE" 2>/dev/null; then
            echo "::error::AIRMIRROR_KEYSTORE_BASE64 is not valid base64. Paste the whole text from airmirror-signing-base64.txt (made by tools/create-signing-key.bat)."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$PASSWORD" >/dev/null 2>&1; then
            echo "::error::AIRMIRROR_KEYSTORE_PASSWORD does not open the key in AIRMIRROR_KEYSTORE_BASE64. Update the password secret to the exact password chosen in tools/create-signing-key.bat (or recreate both secrets from the same run)."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$PASSWORD" -alias airmirror >/dev/null 2>&1; then
            echo "::error::The key in AIRMIRROR_KEYSTORE_BASE64 has no entry named 'airmirror'. Create it with tools/create-signing-key.bat."
            exit 1
          fi
          echo "Signing key OK."
          echo "AIRMIRROR_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AIRMIRROR_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk AirMirrorTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirMirrorTV-apk
          path: AirMirrorTV.apk

      - name: Decide whether to publish a release
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG=""
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; } && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is already released; bump appVersion to publish an update."
            else
              TAG="v$VERSION"
            fi
          fi
          echo "App version: $VERSION, release tag: ${TAG:-none}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.release.outputs.tag != '' && env.AIRMIRROR_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AirMirror TV ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: AirMirrorTV.apk
          generate_release_notes: true
