name: Build APK

# Builds AirMirrorTV.apk on every push to main and on demand.
# Pushing a tag like v1.17 also publishes a GitHub Release with the APK attached,
# which is what the README's "Latest release" download button points to.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the removed 'tools' package.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # gradle.properties points Java at the Windows certificate store (Windows-ROOT), which
      # exists only on Windows. Drop it on this Linux runner so Gradle can download over HTTPS;
      # local Windows builds keep using the file as it is.
      - name: Use the Linux certificate store
        run: |
          sed -i 's/ *-Djavax.net.ssl.trustStoreType=Windows-ROOT//' gradle.properties
          sed -i '/^systemProp.javax.net.ssl.trustStoreType=Windows-ROOT$/d' gradle.properties
          cat gradle.properties

      - name: Build release APK
        run: gradle assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk AirMirrorTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirMirrorTV-apk
          path: AirMirrorTV.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirMirrorTV.apk
          generate_release_notes: true
